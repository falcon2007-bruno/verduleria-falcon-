<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verdulería FALCON</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Archivo CSS propio -->
    <link rel="stylesheet" href="estilos.css">
</head>
<body class="bg-dark text-white">

    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="navbar navbar-dark bg-secondary px-4 py-3 shadow">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">Verdulería FALCON</a>
            <!-- Botón del Carrito que abre el Modal -->
            <button class="btn btn-outline-light" type="button" data-bs-toggle="modal" data-bs-target="#modalCarrito">
                Carrito <span id="span-contador" class="badge bg-primary">0</span>
            </button>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container my-5">
        <p class="text-muted mb-4">Elegí tus productos y agregalos al carrito.</p>
        
        <!-- Contenedor donde se inyectan las cards mediante JavaScript -->
        <div id="contenedor-cards" class="row"></div>
    </main>

    <!-- MODAL DEL CARRITO DE COMPRAS -->
    <div class="modal fade" id="modalCarrito" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title">Tu Carrito</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <!-- Contenedor de items en el carrito -->
                    <div id="contenedor-carrito">
                        <p class="text-center text-muted">El carrito está vacío.</p>
                    </div>
                </div>
                <div class="modal-footer border-secondary d-flex justify-content-between">
                    <h5>Total: <span id="span-total" class="text-success">$0</span></h5>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Archivos JavaScript en orden de dependencia -->
    <script src="datos.js"></script>
    <script src="app.js"></script>
</body>
</html>
